# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# DVWA, Damn Vulnerable Web Application (by Robin Wood and the DVWA contributors) as an Isoloom
# spec: the upstream source, vendored unchanged in build/dvwa/app/, built by its Dockerfile with
# the database host baked in, and a MariaDB machine. The image creates the database at first start.
# `isoloom generate`, then `isoloom up docker`.
version: 1
name: dvwa

networks:
  lab: { cidr: 10.60.2.0/24, internet: false }

machines:
  db:
    networks: { lab: 20 }
    services: [{ port: 3306, name: mariadb }]
    resources: { cpus: 1, memory_mb: 512 }
    volumes: { data: /var/lib/mysql }
    docker:
      build: build/db

  dvwa:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 4280 }]
    resources: { cpus: 1, memory_mb: 512 }
    depends_on: [db]
    docker:
      build: build/dvwa

checks:
  - name: DVWA answers
    http: http://dvwa/login.php
    wait: 180
  - name: admin / password logs in (the database is created)
    script: checks/login.sh
    wait: 90
  - name: the SQL injection module is served
    http: http://dvwa/vulnerabilities/sqli/
    expect: any

message: |
  DVWA answers at http://localhost:{{ machines.dvwa.services.0.publish }}/. The database is
  already created: log in as admin / password, then pick a level on the DVWA Security page.
